version: 1
project:
  title: Earth2Studio Experiments
  authors:
    - name: cgroll
  copyright: '2026'
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
  github: cgroll/e2s-examples
  toc:
    - file: markdown/index.md
    - title: Ensemble forecast
      children:
        - file: notebooks/05_forecast_overview.ipynb
        - file: notebooks/06_validation_report.ipynb
    - title: IC perturbation sweep (SFNO)
