        - file: notebooks/11_perturbation_sweep.ipynb
        - file: notebooks/12_perturbation_zero.ipynb
        - file: notebooks/13_perturbation_brown_0.05.ipynb
        - file: notebooks/14_perturbation_brown_0.01.ipynb
        - file: notebooks/15_perturbation_brown_0.002.ipynb
        - file: notebooks/16_perturbation_gaussian_0.05.ipynb
        - file: notebooks/17_perturbation_bred_vector.ipynb
        - file: notebooks/18_perturbation_z500_brown_200.ipynb
        - file: notebooks/19_perturbation_robustness_season.ipynb
    - title: Population-weighted temperature
      children:
        - file: notebooks/10_germany_population_weighted.ipynb
    - title: Diagnostic model
      children:
        - file: notebooks/07_diagnostic_solar_radiation.ipynb
    - title: Variable subsetting
      children:
        - file: notebooks/08_variable_subset_report.ipynb
    - title: Temporal downscaling
      children:
        - file: notebooks/09_downscaling_overview.ipynb
site:
  options:
    folders: true
  template: book-theme
