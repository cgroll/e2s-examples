[project]
name = "e2s-examples"
version = "0.1.0"
description = "earth2studio experiments: ensemble forecasts, temporal downscaling, variable subsetting, diagnostic models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Orchestration/book tooling only. torch/earth2studio/numpy/xarray/... are
    # deliberately NOT declared here — pipeline scripts run against the
    # pre-built GPU environment at /root/earth2studio-project/.venv instead.
    # See "Dependency management" in README.md for why `uv add earth2studio`
    # doesn't work from a consuming project.
    "dvc>=3.55.0",
    "ipykernel>=6.29.0",
    "jupytext>=1.19.0",
    "mystmd>=1.8.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2s"]
