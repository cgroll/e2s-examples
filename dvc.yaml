  ensemble_validate:
    cmd: >-
      PYTHONPATH=. \${E2S_PYTHON:-/root/earth2studio-project/.venv/bin/python} pipeline/ensemble/02_validate.py &&
      PYTHONPATH=. \${E2S_PYTHON:-/root/earth2studio-project/.venv/bin/python} pipeline/ensemble/03_validate_visualize.py
