  # Diagnostic experiment (not yet a book chapter): does SFNO tolerate IC
  # perturbation, and at what amplitude? See pipeline/perturbation/01_run.py's
  # module docstring for the full story - it grew out of the temporal-
  # downscaling investigation, where Brown(noise_amplitude=0.05) blew up
  # SFNO+InterpModAFNO from the first step.
  perturbation_run:
    cmd: PYTHONPATH=. \${E2S_PYTHON:-/root/earth2studio-project/.venv/bin/python} pipeline/perturbation/01_run.py
